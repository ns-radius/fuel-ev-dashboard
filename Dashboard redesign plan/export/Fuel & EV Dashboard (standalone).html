document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 */\n  --stroke-grey-soft:  #E8E8E8;  /* lighter hairline (spec cards) */\n  --black:             #000000;\n  --black-hover:       #3D3D3D;  /* black button hover */\n  --slate-grey:        #292D32;  /* dark footer surface */\n  --midnight:          #121827;  /* darkest surface / stats banners */\n  --ink:               #101820;  /* primary text (near-black navy) */\n  --grey-500:          #6B6B6B;  /* captions, muted text */\n  --grey-velocity:     #76777A;  /* \"velocity\" wordmark grey */\n\n  /* --- Semantic status -------------------------------------------------- */\n  --success-green:     #0FD46C;  /* success ticks, positive state */\n  --green:             #60BE3E;  /* secondary positive / eco */\n  --info-blue:         #0085FF;  /* informational, links, edit */\n  --info-blue-strong:  #006ACC;\n\n  /* ============================ SEMANTIC ALIASES ====================== */\n\n  /* Text */\n  --text-strong:       var(--ink);\n  --text-body:         var(--ink);\n  --text-muted:        var(--grey-500);\n  --text-inverse:      var(--white);\n  --text-link:         var(--radius-red);\n  --text-link-hover:   var(--radius-red-hover);\n  --text-on-dark:      var(--white);\n\n  /* Surfaces */\n  --surface-page:      var(--white);\n  --surface-subtle:    var(--accent-grey);\n  --surface-card:      var(--white);\n  --surface-dark:      var(--midnight);\n  --surface-footer:    var(--slate-grey);\n  --surface-inverse:   var(--black);\n\n  /* Borders */\n  --border-default:    var(--stroke-grey);\n  --border-soft:       var(--stroke-grey-soft);\n  --border-strong:     var(--black);\n  --border-focus:      var(--radius-red);\n\n  /* Actions */\n  --action-primary:        var(--radius-red);\n  --action-primary-hover:  var(--radius-red-hover);\n  --action-dark:           var(--black);\n  --action-dark-hover:     var(--black-hover);\n\n  /* Status surfaces */\n  --status-success:    var(--success-green);\n  --status-info:       var(--info-blue);\n\n  /* Scrims used over hero imagery (protection gradients) */\n  --scrim-light:       rgba(0,0,0,0.20);\n  --scrim-medium:      rgba(0,0,0,0.40);\n  --scrim-strong:      rgba(0,0,0,0.50);\n}\n<\u002Fstyle>\n  <style>/* ==========================================================================\n   Radius Velocity — Typography tokens\n   Source: Radius.Com Design System / Typography (Figma)\n   Primary face: Manrope. Weights in use: 300 / 400 / 500 / 600 / 700 / 800.\n   The system is responsive: a \"1024px+\" desktop scale and a \"0–1024px\"\n   compact scale. Tokens below default to the desktop scale.\n   ========================================================================== */\n\n:root {\n  /* --- Families -------------------------------------------------------- */\n  --font-sans: \"Manrope\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-ui:   \"Inter\", \"Manrope\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif;\n  --font-alt:  \"Montserrat\", \"Manrope\", sans-serif;\n\n  /* --- Weights --------------------------------------------------------- */\n  --fw-light:     300;  /* @kind font */\n  --fw-regular:   400;  /* @kind font */\n  --fw-medium:    500;  /* @kind font */\n  --fw-semibold:  600;  /* @kind font */\n  --fw-bold:      700;  /* @kind font */\n  --fw-extrabold: 800;  /* @kind font */\n\n  /* --- Display (1024px+) ----------------------------------------------- */\n  --text-d1-size: 70px;  --text-d1-lh: 80px;\n  --text-d2-size: 60px;  --text-d2-lh: 70px;\n  --text-d3-size: 50px;  --text-d3-lh: 60px;\n\n  /* --- Headings (1024px+) ---------------------------------------------- */\n  --text-h1-size: 46px;  --text-h1-lh: 56px;\n  --text-h2-size: 32px;  --text-h2-lh: 42px;\n  --text-h3-size: 24px;  --text-h3-lh: 34px;\n  --text-h4-size: 18px;  --text-h4-lh: 28px;\n\n  /* --- Headings (0–1024px / compact) ----------------------------------- */\n  --text-h1-c-size: 28px; --text-h1-c-lh: 38px;\n  --text-h2-c-size: 24px; --text-h2-c-lh: 34px;\n  --text-h3-c-size: 20px; --text-h3-c-lh: 30px;\n  --text-h4-c-size: 16px; --text-h4-c-lh: 26px;\n\n  /* --- Body ------------------------------------------------------------ */\n  --text-intro-lg-size: 20px; --text-intro-lg-lh: 30px;\n  --text-intro-size:    18px; --text-intro-lh:    28px;\n  --text-body-size:     16px; --text-body-lh:     26px;  /* desktop body */\n  --text-body-sm-size:  14px; --text-body-sm-lh:  24px;  /* compact body */\n\n  /* --- Caption --------------------------------------------------------- */\n  --text-caption-size:  12px; --text-caption-lh:  22px;\n  --text-caption-tracking: 0.5px;\n\n  --tracking-wide: 0.5px;\n}\n\n/* --------------------------------------------------------------------------\n   Type helper classes — apply the scale without re-declaring every property.\n   -------------------------------------------------------------------------- */\n.t-d1  { font: var(--fw-bold) var(--text-d1-size)/var(--text-d1-lh) var(--font-sans); letter-spacing: -0.5px; }\n.t-d2  { font: var(--fw-bold) var(--text-d2-size)/var(--text-d2-lh) var(--font-sans); letter-spacing: -0.5px; }\n.t-d3  { font: var(--fw-bold) var(--text-d3-size)/var(--text-d3-lh) var(--font-sans); letter-spacing: -0.25px; }\n.t-h1  { font: var(--fw-bold) var(--text-h1-size)/var(--text-h1-lh) var(--font-sans); }\n.t-h2  { font: var(--fw-bold) var(--text-h2-size)/var(--text-h2-lh) var(--font-sans); }\n.t-h3  { font: var(--fw-semibold) var(--text-h3-size)/var(--text-h3-lh) var(--font-sans); }\n.t-h4  { font: var(--fw-semibold) var(--text-h4-size)/var(--text-h4-lh) var(--font-sans); }\n.t-intro-lg { font: var(--fw-regular) var(--text-intro-lg-size)/var(--text-intro-lg-lh) var(--font-sans); }\n.t-intro    { font: var(--fw-regular) var(--text-intro-size)/var(--text-intro-lh) var(--font-sans); }\n.t-body     { font: var(--fw-regular) var(--text-body-size)/var(--text-body-lh) var(--font-sans); }\n.t-body-strong { font: var(--fw-semibold) var(--  palette (raw) --------------------------------------------- */\n  --radius-red:        #E51B22;  /* primary brand colour, CTAs */\n  --radius-red-hover:  #A61419;  /* primary hover / pressed */\n  --radius-mark-red:   #EA0029;  /* the \"r\" logo mark only */\n\n  --white:             #FFFFFF;\n  --accent-grey:       #F7F7F8;  /* page / section surface */\n  --stroke-grey:       #D9D9D9;  /* hairline borders */\n  --stroke-grey-soft:  #E8E8E8;  /* lighter hairline (spec cards) */\n  --black:             #000000;\n  --black-hover:       #3D3D3D;  /* black button hover */\n  --slate-grey:        #292D32;  /* dark footer surface */\n  --midnight:          #121827;  /* darkest surface / stats banners */\n  --ink:               #101820;  /* primary text (near-black navy) */\n  --grey-500:          #6B6B6B;  /* captions, muted text */\n  --grey-velocity:     #76777A;  /* \"velocity\" wordmark grey */\n\n  /* --- Semantic status -------------------------------------------------- */\n  --success-green:     #0FD46C;  /* success ticks, positive state */\n  --green:             #60BE3E;  /* secondary positive / eco */\n  --info-blue:         #0085FF;  /* informational, links, edit */\n  --info-blue-strong:  #006ACC;\n\n  /* ============================ SEMANTIC ALIASES ====================== */\n\n  /* Text */\n  --text-strong:       var(--ink);\n  --text-body:         var(--ink);\n  --text-muted:        var(--grey-500);\n  --text-inverse:      var(--white);\n  --text-link:         var(--radius-red);\n  --text-link-hover:   var(--radius-red-hover);\n  --text-on-dark:      var(--white);\n\n  /* Surfaces */\n  --surface-page:      var(--white);\n  --surface-subtle:    var(--accent-grey);\n  --surface-card:      var(--white);\n  --surface-dark:      var(--midnight);\n  --surface-footer:    var(--slate-grey);\n  --surface-inverse:   var(--black);\n\n  /* Borders */\n  --border-default:    var(--stroke-grey);\n  --border-soft:       var(--stroke-grey-soft);\n  --border-strong:     var(--black);\n  --border-focus:      var(--radius-red);\n\n  /* Actions */\n  --action-primary:        var(--radius-red);\n  --action-primary-hover:  var(--radius-red-hover);\n  --action-dark:           var(--black);\n  --action-dark-hover:     var(--black-hover);\n\n  /* Status surfaces */\n  --status-success:    var(--success-green);\n  --status-info:       var(--info-blue);\n\n  /* Scrims used over hero imagery (protection gradients) */\n  --scrim-light:       rgba(0,0,0,0.20);\n  --scrim-medium:      rgba(0,0,0,0.40);\n  --scrim-strong:      rgba(0,0,0,0.50);\n}\n\n/* ==========================================================================\n   Radius Velocity — Typography tokens\n   Source: Radius.Com Design System / Typography (Figma)\n   Primary face: Manrope. Weights in use: 300 / 400 / 500 / 600 / 700 / 800.\n   The system is responsive: a \"1024px+\" desktop scale and a \"0–1024px\"\n   compact scale. Tokens below default to the desktop scale.\n   ========================================================================== */\n\n:root {\n  /* --- Families -------------------------------------------------------- */\n  --font-sans: \"Manrope\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-ui:   \"Inter\", \"Manrope\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif;\n  --font-alt:  \"Montserrat\", \"Manrope\", sans-serif;\n\n  /* --- Weights --------------------------------------------------------- */\n  --fw-light:     300;  /* @kind font */\n  --fw-regular:   400;  /* @kind font */\n  --fw-medium:    500;  /* @kind font */\n  --fw-semibold:  600;  /* @kind font */\n  --fw-bold:      700;  /* @kind font */\n  --fw-extrabold: 800;  /* @kind font */\n\n  /* --- Display (1024px+) ----------------------------------------------- */\n  --text-d1-size: 70px;  --text-d1-lh: 80px;\n  --text-d2-size: 60px;  --text-d2-lh: 70px;\n  --text-d3-size: 50px;  --text-d3-lh: 60px;\n\n  /* --- Headings (1024px+) ---------------------------------------------- */\n  --text-h1-size: 46px;  --text-h1-lh: 56px;\n  --text-h2-size: 32px;  --text-h2-lh: 42px;\n  --text-h3-size: 24px;  --text-h3-lh: 34px;\n  --text-h4-size: 18px;  --text-h4-lh: 28px;\n\n  /* --- Headings (0–1024px / compact) ----------------------------------- */\n  --text-h1-c-size: 28px; --text-h1-c-lh: 38px;\n  --text-h2-c-size: 24px; --text-h2-c-lh: 34px;\n  --text-h3-c-size: 20px; --text-h3-c-lh: 30px;\n  --text-h4-c-size: 16px; --text-h4-c-lh: 26px;\n\n  /* --- Body ------------------------------------------------------------ */\n  --text-intro-lg-size: 20px; --text-intro-lg-lh: 30px;\n  --text-intro-size:    18px; --text-intro-lh:    28px;\n  --text-body-size:     16px; --text-body-lh:     26px;  /* desktop body */\n  --text-body-sm-size:  14px; --text-body-sm-lh:  24px;  /* compact body */\n\n  /* --- Caption --------------------------------------------------------- */\n  --text-caption-size:  12px; --text-caption-lh:  22px;\n  --text-caption-tracking: 0.5px;\n\n  --tracking-wide: 0.5px;\n}\n\n/* --------------------------------------------------------------------------\n   Type helper classes — apply the scale without re-declaring every property.\n   -------------------------------------------------------------------------- */\n.t-d1  { font: var(--fw-bold) var(--text-d1-size)/var(--text-d1-lh) var(--font-sans); letter-spacing: -0.5px; }\n.t-d2  { font: var(--fw-bold) var(--text-d2-size)/var(--text-d2-lh) var(--font-sans); letter-spacing: -0.5px; }\n.t-d3  { font: var(--fw-bold) var(--text-d3-size)/var(--text-d3-lh) var(--font-sans); letter-spacing: -0.25px; }\n.t-h1  { font: var(--fw-bold) var(--text-h1-size)/var(--text-h1-lh) var(--font-sans); }\n.t-h2  { font: var(--fw-bold) var(--text-h2-size)/var(--text-h2-lh) var(--font-sans); }\n.t-h3  { font: var(--fw-semibold) var(--text-h3-size)/var(--text-h3-lh) var(--font-sans); }\n.t-h4  { font: var(--fw-semibold) var(--text-h4-size)/var(--text- , time:'28/06/26 18:56' },\n    { card:'•••• 4821', holder:'Dele Okafor', type:'Fuel alert', typeFilter:'fuel', alertTitle:'Volume alert', alertDesc:'92.4 L over 90 L limit', location:'Shell M6 Lymm', time:'28/06/26 06:14' },\n    { card:'•••• 2210', holder:'Owen Davies', type:'EV alert', typeFilter:'ev', alertTitle:'Charge', alertDesc:'Total charge exceeds 80kWh', location:'Gridserve Rugby', time:'28/06/26 20:11' },\n    { card:'•••• 1043', holder:'Sarah Hughes', type:'Fuel alert', typeFilter:'fuel', alertTitle:'Time alert', alertDesc:'Transaction outside working hours', location:'BP Knutsford', time:'27/06/26 23:12' },\n    { card:'•••• 5530', holder:'Megan Lewis', type:'EV alert', typeFilter:'ev', alertTitle:'Time', alertDesc:'Charged between 22:00 and 05:00', location:'BP Pulse Leeds', time:'28/06/26 15:02' },\n    { card:'•••• 6627', holder:'Mark Reilly', type:'Fuel alert', typeFilter:'fuel', alertTitle:'Frequency alert', alertDesc:'4th fill within 24 hours', location:'Texaco Salford', time:'27/06/26 14:38' },\n    { card:'•••• 8814', holder:'Chris Allen', type:'EV alert', typeFilter:'ev', alertTitle:'Charge', alertDesc:'Total charge exceeds 65kWh', location:'Shell Recharge M1', time:'27/06/26 18:44' },\n    { card:'•••• 3390', holder:'Priya Patel', type:'Fuel alert', typeFilter:'fuel', alertTitle:'Product alert', alertDesc:'Super unleaded on diesel card', location:'Shell Trafford Park', time:'27/06/26 09:05' },\n    { card:'•••• 4127', holder:'Nina Roberts', type:'EV alert', typeFilter:'ev', alertTitle:'Frequency', alertDesc:'Third charge of the day', location:'Pod Point Stafford', time:'27/06/26 11:20' },\n    { card:'•••• 5512', holder:'Tom Bennett', type:'Fuel alert', typeFilter:'fuel', alertTitle:'Volume alert', alertDesc:'28.7 L over 25 L limit', location:'Esso Warrington', time:'26/06/26 17:43' },\n    { card:'•••• 9902', holder:'Hassan Ali', type:'EV alert', typeFilter:'ev', alertTitle:'Charge', alertDesc:'Total charge exceeds 72kWh', location:'Gridserve Braintree', time:'26/06/26 08:15' },\n    { card:'•••• 6671', holder:'Daniel Ford', type:'Fuel alert', typeFilter:'fuel', alertTitle:'Volume alert', alertDesc:'26.2 L over 25 L limit', location:'Esso Eccles', time:'24/06/26 19:15' },\n    { card:'•••• 3075', holder:'Ellie Wright', type:'EV alert', typeFilter:'ev', alertTitle:'Frequency', alertDesc:'Second charge within 4 hours', location:'Osprey Banbury', time:'25/06/26 13:48' },\n  ];\n  ALERT_COLUMN_DEFS = [\n    { key:'card', label:'Card', align:'left', type:'text', width:'16%' },\n    { key:'type', label:'Type', align:'left', type:'text', width:'14%' },\n    { key:'alertTitle', label:'Alert', align:'left', type:'text', width:'32%' },\n    { key:'location', label:'Location', align:'left', type:'text', width:'22%' },\n  ];\n  sortTable(stateKey, colKey, colType) {\n    this.setState(s => {\n      const cur = s[stateKey] || { key: null, dir: 'asc' };\n      const dir = cur.key === colKey ? (cur.dir === 'asc' ? 'desc' : 'asc') : (colType === 'text' ? 'asc' : 'desc');\n      return { [stateKey]: { key: colKey, dir } };\n    });\n  }\n  sortColumnDefs(defs, stateKey) {\n    return defs.map(c => {\n      const sort = this.state[stateKey] || { key: null, dir: 'asc' };\n      const active = sort.key === c.key;\n      const dir = active ? sort.dir : null;\n      return {\n        label: c.label,\n        thStyle: { display:'table-cell', position:'sticky', top:0, zIndex:1, background:'#000', color:'#fff', fontWeight:700, fontSize: (stateKey==='cardSort'||stateKey==='cardIdSort') ? '11.5px' : '11px', textAlign:c.align, padding: (stateKey==='cardSort'||stateKey==='cardIdSort') ? '11px 12px' : '10px 10px', whiteSpace:'nowrap', width:c.width, cursor:'pointer', borderBottom: active ? '2px solid #E51B22' : '2px solid transparent' },\n        onClick: () => this.sortTable(stateKey, c.key, c.type),\n        upColor: active && dir === 'asc' ? '#ffffff' : 'rgba(255,255,255,0.35)',\n        downColor: active && dir === 'desc' ? '#ffffff' : 'rgba(255,255,255,0.35)',\n      };\n    });\n  }\n  getSortedCardRows() {\n    const filter = this.state.cardTypeFilter2;\n    let rows = this.CARD_ROWS.filter(r => filter === 'both' || r.typeFilter === filter);\n    const { key, dir } = this.state.cardSort || { key: 'spend', dir: 'desc' };\n    if (key) {\n      rows = rows.slice().sort((a, b) => {\n        let av = a[key], bv = b[key];\n        if (typeof av === 'string') { av = av.toLowerCase(); bv = bv.toLowerCase(); }\n        if (av < bv) return dir === 'asc' ? -1 : 1;\n        if (av > bv) return dir === 'asc' ? 1 : -1;\n        return 0;\n      });\n    }\n    return rows.map(r => ({\n      brand:r.brand, brandBg:r.brandBg, brandColor:r.brandColor, type:r.type,\n      cards:r.cards, active:r.active,\n      expiring:r.expiring, expiringColor: r.expiring > 0 ? '#E0A800' : '#c4c6c9',\n      stopped:r.stopped, stoppedColor: r.stopped > 0 ? '#e51b22' : '#c4c6c9',\n      spend: '£' + r.spend.toLocaleString('en-GB'),\n    }));\n  }\n  naButtonStyle(sev, acted) {\n    const base = { display:'inline-flex', alignItems:'center', height:'34px', padding:'0 16px', borderRadius:'8px', fontSize:'13px', fontWeight:600, cursor:'pointer', whiteSpace:'nowrap', transition:'background 160ms ease, color 160ms ease' };\n    if (acted) return Object.assign(base, { background:'#fff', border:'1px solid #d9d9d9', color:'#9a9da3', cursor:'default' });\n    if (sev === 'critical') return Object.assign(base, { background:'#e51b22', color:'#fff', border:'1px solid #e51b22' });\n    return Object.assign(base, { background:'#000', color:'#fff', border:'1px solid #000' });\n  }\n  naButtonHover(sev, acted) {\n    if (acted) return {};\n    if (sev === 'critical') return { background:'#A61419' };\n    return { background:'#3D3D3D' };\n  }\n  statusColor(s) { return s === 'Active' ? '#2f8f4a' : s === 'Expiring soon' ? '#b5790a' : s === 'Stopped' ? '#c4161c' : '#6f727a'; }\n  statusBg(s) { return s === 'Active' ? 'rgba(64,174,90,0.12)' : s === 'Expiring soon' ? 'rgba(224,168,0,0.14)' : s === 'Stopped' ? 'rgba(229,27,34,0.08)' : '#eef0f1'; }\n  getSortedCardIdRows() {\n    const filter = this.state.cardTypeFilter2;\n    let rows = this.CARD_IDENTIFIER_ROWS.filter(r => filter === 'both' || r.typeFilter === filter);\n    const { key, dir } = this.state.cardIdSort || { key: 'spend', dir: 'desc' };\n    if (key) {\n      rows = rows.slice().sort((a, b) => {\n        let av, bv;\n        if (key === 'id') { av = a.ident; bv = b.ident; }\n        else if (key === 'spend') { av = a.spend; bv = b.spend; }\n        else { av = String(a[key]).toLowerCase(); bv = String(b[key]).toLowerCase(); }\n        if (av < bv) return dir === 'asc' ? -1 : 1;\n        if (av > bv) return dir === 'asc' ? 1 : -1;\n        return 0;\n      });\n    }\n    return rows.map(r => ({\n      id:r.id, type:r.type, brand:r.brand, brandBg:r.brandBg, brandColor:r.brandColor,\n      status:r.status, statusColor:this.statusColor(r.status), statusBg:this.statusBg(r.status),\n      spend: '£' + r.spend.toLocaleString('en-GB'),\n    }));\n  }\n  getSortedAlertRows() {\n    const filter = this.state.alertFilter2;\n    let rows = this.ALERT_ROWS.filter(r => filter === 'both' || r.typeFilter === filter);\n    const { key, dir } = this.state.alertSort || { key: null, dir: 'asc' };\n    if (key) {\n      rows = rows.slice().sort((a, b) => {\n        let av, bv;\n        if (key === 'card') { av = parseInt(a.card.replace(/\\D/g,''),10); bv = parseInt(b.card.replace(/\\D/g,''),10); }\n        else { av = String(a[key]).toLowerCase(); bv = String(b[key]).toLowerCase(); }\n        if (av < bv) return dir === 'asc' ? -1 : 1;\n        if (av > bv) return dir === 'asc' ? 1 : -1;\n        return 0;\n      });\n    }\n    return rows;\n  }\n\n  NAV_LINKS = [\n    { label:'Home', icon:'home' },\n    { label:'Fuel Cards', active:true },\n    { label:'Telematics' },\n    { label:'Compare', fullLabel:'Radius Compare' },\n    { label:'Dashboard' },\n    { l
