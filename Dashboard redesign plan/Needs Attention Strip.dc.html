<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/radius-velocity-design-system-0a984d65-e4b9-4e8e-80da-c710c9ba6306/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/radius-velocity-design-system-0a984d65-e4b9-4e8e-80da-c710c9ba6306/tokens/colors.css">
  <link rel="stylesheet" href="_ds/radius-velocity-design-system-0a984d65-e4b9-4e8e-80da-c710c9ba6306/tokens/typography.css">
  <link rel="stylesheet" href="_ds/radius-velocity-design-system-0a984d65-e4b9-4e8e-80da-c710c9ba6306/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/radius-velocity-design-system-0a984d65-e4b9-4e8e-80da-c710c9ba6306/tokens/base.css">
  <link rel="stylesheet" href="_ds/radius-velocity-design-system-0a984d65-e4b9-4e8e-80da-c710c9ba6306/styles.css">
  <script src="_ds/radius-velocity-design-system-0a984d65-e4b9-4e8e-80da-c710c9ba6306/_ds_bundle.js"></script>
  <style>
    .lnk { font-weight:600; color:#000; cursor:pointer; }
    .lnk:hover { color:#e51b22; }
  </style>
</helmet>

<div style="min-height:100vh; background:#f0f1f3; padding:clamp(16px,5vw,32px) clamp(12px,4vw,24px); box-sizing:border-box; font-family:Manrope,system-ui,sans-serif; color:#000000; display:flex; flex-direction:column; gap:24px; align-items:center;">

  <div style="width:100%; max-width:1240px; display:flex; flex-direction:column; gap:24px;">

    <!-- ============ NEEDS ATTENTION STRIP ============ -->
    <section style="background:#fff; border-radius:10px; padding:24px; display:flex; flex-direction:column; gap:16px; border-top:3px solid #e51b22;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
        <div style="display:flex; align-items:center; gap:10px;">
          <h2 style="margin:0; font-size:18px; font-weight:700;">Needs attention</h2>
          <span style="display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:24px; padding:0 7px; border-radius:9999px; background:#e51b22; color:#fff; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums;">{{ itemCount }}</span>
        </div>
        <sc-if value="{{ hasDismissed }}" hint-placeholder-val="{{ false }}">
          <span onClick="{{ restoreAll }}" class="lnk" style="font-size:13px;">Restore dismissed ({{ dismissedCount }})</span>
        </sc-if>
      </div>

      <div style="display:flex; flex-direction:column; gap:10px;">
        <sc-for list="{{ items }}" as="item" hint-placeholder-count="4">
          <div style="display:flex; align-items:center; gap:14px; border:1px solid #d9d9d9; border-radius:10px; padding:14px 16px; flex-wrap:wrap;" style-hover="border-color:#000;">
            <span style="width:10px; height:10px; border-radius:50%; background:{{ item.dotColor }}; flex-shrink:0;"></span>
            <div style="flex:1 1 260px; min-width:0; display:flex; flex-direction:column; gap:2px; line-height:1.3;">
              <span style="font-size:14px; font-weight:600;">{{ item.title }}</span>
              <span style="font-size:12.5px; color:#6f727a;">{{ item.detail }}</span>
            </div>
            <div style="display:flex; align-items:center; gap:10px; flex-shrink:0;">
              <span onClick="{{ item.act }}" style="{{ item.buttonStyle }}" style-hover="{{ item.buttonHoverStyle }}">{{ item.action }}</span>
              <span onClick="{{ item.dismiss }}" title="Dismiss" style="display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:8px; color:#9a9da3; cursor:pointer;" style-hover="background:#f7f7f8; color:#000;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg></span>
            </div>
          </div>
        </sc-for>
        <sc-if value="{{ allClear }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex; align-items:center; gap:12px; border:1px solid #d9d9d9; border-radius:10px; padding:18px 16px;">
            <span style="display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; background:rgba(15,212,108,0.12);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0FD46C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 10 18 20 6"></polyline></svg></span>
            <span style="font-size:14px; font-weight:600;">All clear — nothing needs your attention right now.</span>
          </div>
        </sc-if>
      </div>
    </section>

    <p style="margin:0; font-size:12.5px; color:#6f727a; text-align:center;">Prototype — sits directly below the KPI strip on the dashboard. Try the action and dismiss controls.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:560}}">
class Component extends DCLogic {
  state = { dismissed: [], acted: [] };

  DATA = [
    { id:'expiring', sev:'critical', title:'4 cards expire within 30 days', detail:'Shell •••• 7890, •••• 1043 and 2 more — renew before 31 Jul to avoid declined transactions.', action:'Renew cards' },
    { id:'alerts', sev:'critical', title:'Card •••• 7890 has 3 alerts this week', detail:'2 volume, 1 time — John Smith. Most recent: 33.06 L over 25 L limit, Esso Warrington.', action:'Review card' },
    { id:'evspend', sev:'warning', title:'EV spend up 22% vs May', detail:'£678 vs £556 prior period, driven by BP Pulse Leeds. Volume up only 9%.', action:'See breakdown' },
    { id:'invoice', sev:'warning', title:'Invoice £1,975.96 due in 11 days', detail:'Due 14 June · status outstanding.', action:'View invoice' },
  ];

  btnStyle(sev, acted) {
    const base = { display:'inline-flex', alignItems:'center', height:'34px', padding:'0 16px', borderRadius:'8px', fontSize:'13px', fontWeight:600, cursor:'pointer', whiteSpace:'nowrap', transition:'background 160ms ease, color 160ms ease' };
    if (acted) return Object.assign(base, { background:'#fff', border:'1px solid #d9d9d9', color:'#9a9da3', cursor:'default' });
    if (sev === 'critical') return Object.assign(base, { background:'#e51b22', color:'#fff', border:'1px solid #e51b22' });
    return Object.assign(base, { background:'#000', color:'#fff', border:'1px solid #000' });
  }

  btnHover(sev, acted) {
    if (acted) return {};
    if (sev === 'critical') return { background:'#A61419' };
    return { background:'#3D3D3D' };
  }

  renderVals() {
    const { dismissed, acted } = this.state;
    const visible = this.DATA.filter(d => !dismissed.includes(d.id));
    const items = visible.map(d => {
      const done = acted.includes(d.id);
      return {
        title: d.title,
        detail: d.detail,
        action: done ? 'Done ✓'.replace(' ✓','') : d.action,
        dotColor: d.sev === 'critical' ? '#e51b22' : '#E0A800',
        buttonStyle: this.btnStyle(d.sev, done),
        buttonHoverStyle: this.btnHover(d.sev, done),
        act: () => { if (!this.state.acted.includes(d.id)) this.setState(s => ({ acted: s.acted.concat(d.id) })); },
        dismiss: () => this.setState(s => ({ dismissed: s.dismissed.concat(d.id) })),
      };
    });
    return {
      items,
      itemCount: items.length,
      allClear: items.length === 0,
      hasDismissed: dismissed.length > 0,
      dismissedCount: dismissed.length,
      restoreAll: () => this.setState({ dismissed: [] }),
    };
  }
}
</script>
</body>
</html>
